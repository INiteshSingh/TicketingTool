<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Raised</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            min-height: 100vh;
        }

        nav {
            background: #ffffff;
            padding: 18px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        nav a {
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            min-height: calc(100vh - 65px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 45px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .ticket-number {
            display: inline-block;
            background: #f3f4f6;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .home-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'home_page' %}">Home</a>
    </nav>

    <main class="container">
        <div class="card">

            <div class="success-icon">
                ✓
            </div>

            <h1>Ticket Raised Successfully</h1>

            <p>
                Your support ticket has been created successfully.
            </p>

            <div class="ticket-number">
                Ticket #{{ ticket_number }}
            </div>

            <br>

            <a href="{% url 'home_page' %}" class="home-button">
                Back to Home
            </a>

        </div>
    </main>

</body>
</html>
