<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HelpDesk{% endblock %}</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* Header / Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .top-bar h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .user-details {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* Navigation */
        nav {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            padding: 0.75rem 1rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .nav-links a:hover {
            color: var(--primary-color);
            background-color: #eff6ff;
        }

        /* Main Dynamic Content Area */
        .main-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo">
            <h1>Ticketing Tool</h1>
        </div>
        <div class="user-details">
            User Details
        </div>
    </header>

    <nav>
        <ul class="nav-links">
            <li><a href="{% url 'Raise A Ticket' %}">Raise Ticket</a></li>
            <li><a href="{% url 'Track Ticket' %}">Track Ticket</a></li>
            <li><a href="{% url 'Get Support' %}">Get Support</a></li>
        </ul>
    </nav>

    <main class="main-container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
