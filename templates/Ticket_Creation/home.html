<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HelpDesk{% endblock %}</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* App Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 2rem;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .top-bar h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .user-details {
            font-size: 0.875rem;
            color: var(--text-muted);
            background-color: var(--background);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
        }

        /* Navigation Bar */
        nav {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.5rem 0.85rem;
            border-radius: var(--radius-md);
            transition: all 0.15s ease-in-out;
        }

        .nav-links a:hover {
            color: var(--primary);
            background-color: #eff6ff;
        }

        /* Main Workspace */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Chatbot Container & Utilities */
        .chatbot {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            min-height: 480px;
        }

        .chat-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .chat-input-area {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            background-color: #fafafa;
        }

        .chat-input-area input {
            flex: 1;
            padding: 0.6rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--primary);
        }

        .chat-input-area button {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .chat-input-area button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo">
            <h1>Ticketing Tool</h1>
        </div>
        <div class="user-details">
            User Details
        </div>
    </header>

    <nav>
        <ul class="nav-links">
            <li><a href="{% url 'Raise A Ticket' %}">Raise Ticket</a></li>
            <li><a href="{% url 'Track Ticket' %}">Track Ticket</a></li>
            <li><a href="{% url 'Get Support' %}">Get Support</a></li>
        </ul>
    </nav>

    <main class="main-container">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}

</body>
</html>
