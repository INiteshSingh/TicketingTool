<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HelpDesk{% endblock %}</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* App Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 2rem;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .top-bar h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .user-details {
            font-size: 0.875rem;
            color: var(--text-muted);
            background-color: var(--background);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
        }

        /* Navigation Bar */
        nav {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            
        }

        .nav-links {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.5rem 0.85rem;
            border-radius: var(--radius-md);
            transition: all 0.15s ease-in-out;
        }

        .nav-links a:hover {
            color: var(--primary);
            background-color: #eff6ff;
        }

        .chatbot {
    border: 1px solid var(--border);
    width: 40%;
    min-width: 450px;
    height: 600px;
    margin: 2rem auto;
    border-radius: var(--radius-lg);
    background-color: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow-md);
}

/* Area where the conversation appears */
#response {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

/* One user + AI exchange */
.chat {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    width: 100%;
}

/* User message */
.prompt-return {
    align-self: flex-end;
    max-width: 75%;
    background-color: var(--primary);
    color: white;
    padding: 0.65rem 0.9rem;
    border-radius: 14px 14px 3px 14px;
    font-size: 0.9rem;
    line-height: 1.4;
    overflow-wrap: break-word;
}

/* AI response */
.response-return {
    align-self: flex-start;
    max-width: 75%;
    background-color: #f1f5f9;
    color: var(--text-main);
    padding: 0.65rem 0.9rem;
    border-radius: 14px 14px 14px 3px;
    font-size: 0.9rem;
    line-height: 1.4;
    border: 1px solid var(--border);
    overflow-wrap: break-word;
}

/* Input area */
.input-area {
    border-top: 1px solid var(--border);
    padding: 0.8rem;
    background-color: var(--surface);
}

#chat-form {
    display: flex;
    gap: 0.5rem;
}

#Prompt {
    flex: 1;
    width: auto;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    font-size: 0.9rem;
}

#Prompt:focus {
    border-color: var(--primary);
}

#send {
    border: none;
    background-color: var(--primary);
    color: white;
    padding: 0.65rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

#send:hover {
    background-color: var(--primary-hover);
}
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo">
            <h1>Ticketing Tool</h1>
        </div>
        <div class="user-details">
            User Details
        </div>
    </header>

    <nav>
        <ul class="nav-links">
            <li><a href="{% url 'Raise A Ticket' %}">Raise Ticket</a></li>
            <li><a href="{% url 'Track Ticket' %}">Track Ticket</a></li>
            <li><a href="{% url 'Get Support' %}">Get Support</a></li>
        </ul>
    </nav>

    <main class="main-container">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}

</body>
</html>
